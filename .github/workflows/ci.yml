name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Lint do backend (ruff)
        run: |
          pip install ruff
          ruff check backend

      - name: Instalar dependências do backend
        run: pip install -r backend/requirements-dev.txt

      # O mesmo Tesseract da imagem de produção: o teste de PDF escaneado
      # (test_extracao_texto.py) só roda com ele.
      - name: Instalar o Tesseract (OCR)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por fonts-dejavu-core

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Subir stack local do Supabase (aplica as migrations automaticamente)
        run: supabase start

      - name: Gerar backend/.env a partir das chaves locais do Supabase
        run: |
          eval "$(supabase status -o env)"
          cat > backend/.env <<EOF
          SUPABASE_URL=${API_URL}
          SUPABASE_ANON_KEY=${ANON_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
          JWT_SECRET=${JWT_SECRET}
          CORS_ORIGINS=http://localhost:5173
          ENABLE_OCR_WORKER=false
          DEMO_PASSWORD=ci-demo-password-not-real
          EOF

      - name: Rodar testes de integração (pytest)
        working-directory: backend
        run: pytest tests -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Checagem de tipos (tsc)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build de produção (vite)
        working-directory: frontend
        run: npm run build

  # Ensaio de backup e restauração (achado X2-05): os mesmos scripts do backup
  # diário de produção, contra o Supabase local — semeia, copia, bagunça,
  # restaura e confere contagens e a cadeia de hash da trilha.
  backup-ensaio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Subir stack local do Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,realtime,storage-api

      - name: Instalar o cliente do Postgres 17 (mesma versão da produção)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Ensaiar backup e restauração
        run: bash backend/scripts/backup/ensaio.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
