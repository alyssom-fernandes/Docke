name: Keep-alive

# O plano Free do Supabase pausa o projeto depois de 7 dias com pouca
# atividade. Uma consulta por dia, via API, mantém o banco (e a demo) de pé.
# A API na Fly liga para atender e desliga sozinha depois (auto_stop).
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar o banco pela API
        run: curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 https://docke-api.fly.dev/health/db
